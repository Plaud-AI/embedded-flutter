name: embedded_flutter
description: "Flutter demo for the Plaud SDK — pair a Plaud recorder over BLE, sync recordings, and transcribe them via the Plaud cloud API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  http: ^1.5.0
  plaud_sdk:
    path: plugins/plaud_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
