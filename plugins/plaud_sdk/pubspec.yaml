name: plaud_sdk
description: Flutter bridge for the Plaud device SDK (iOS + Android) — BLE scan/connect, on-device recording list, and audio export.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PlaudSdkPlugin
      android:
        package: ai.plaud.plaud_sdk
        pluginClass: PlaudSdkPlugin
